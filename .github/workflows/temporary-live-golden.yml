name: Temporary live Golden Path diagnostic
on:
  push:
    branches: [feature/golden-path-play-history]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch live current Smush board
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request
          url='https://fourbythree-stats.hankmt.workers.dev/spub?d=2026-10-13'
          headers={'User-Agent':'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1','Accept':'application/json, text/plain, */*','Origin':'https://rbleattler.github.io','Referer':'https://rbleattler.github.io/smush-solver/'}
          data=json.load(urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20))
          with open('/tmp/today.json','w') as f:json.dump(next(entry['puzzle'] for entry in data['puzzles'] if entry['date']=='2026-10-13'),f)
          PY
      - name: Check full-board Golden Path ranking and exact-cover math
        run: |
          node <<'JS'
          const fs=require('fs'),vm=require('vm'),{performance}=require('perf_hooks');
          const puzzle=JSON.parse(fs.readFileSync('/tmp/today.json','utf8'));
          let result, failure;
          const worker={performance,self:{onmessage:null,postMessage:x=>{if(x.type==='result')result=x;if(x.type==='error')failure=x}}};
          vm.runInNewContext(fs.readFileSync('solver-worker.js','utf8'),worker);
          const finite=puzzle.chunks.filter(letter=>letter!==puzzle.required);
          const start=performance.now();
          worker.self.onmessage({data:{puzzle,currentSpice:'h',remaining:finite.map(()=>5),played:[],priorScore:0,firstPangram:false,maxWords:10,timeBudget:15000}});
          if(failure)throw Error(JSON.stringify(failure));
          if(!result||!result.best||!result.robust)throw Error('No clean plate found');
          if(result.bySpice.length!==8)throw Error('Expected eight spicy comparison groups');
          const accepted=new Set(puzzle.words);
          for(const scenario of result.bySpice)for(const choice of scenario.choices){
            const consumed=Array(8).fill(0),seen=new Set();
            for(const p of choice.path){
              if(!accepted.has(p.word)||seen.has(p.word)||!p.word.includes('i'))throw Error('Invalid route word '+p.word);
              p.cost.forEach((n,i)=>consumed[i]+=n);
              seen.add(p.word);
            }
            if(!consumed.every(x=>x===5))throw Error('Route does not clean plate');
          }
          console.log('LIVE',JSON.stringify({elapsedMs:Math.round(performance.now()-start),covers:result.covers,complete:result.complete,first:result.best.path[0].word,scenarios:result.bySpice.map(x=>[x.spice,x.choices.length]),robust:result.robust.path[0].word}));
          JS
