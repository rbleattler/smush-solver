name: Diagnose live Smush feed
on:
  push:
    branches: [fix/feed-compatibility-oct2026]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Compare feed paths and browser headers
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json
          urls=["https://fourbythree-stats.hankmt.workers.dev/spub","https://fourbythree-stats.hankmt.workers.dev/spub?d=2026-10-13","https://www.hankgreen.com/smush/"]
          for url in urls:
            for browser in [False,True]:
              headers={"User-Agent":"Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1","Accept":"application/json, text/plain, */*","Origin":"https://www.hankgreen.com","Referer":"https://www.hankgreen.com/smush/"} if browser else {}
              req=urllib.request.Request(url,headers=headers)
              try:
                with urllib.request.urlopen(req,timeout=15) as res:
                  data=res.read()
                  print("URL",url,"BROWSER",browser,"STATUS",res.status,"SIZE",len(data),"CONTENTTYPE",res.headers.get("Content-Type"))
                  if "/spub" in url:
                    try:
                      d=json.loads(data)
                      print("DATAKEYS",list(d) if isinstance(d,dict) else type(d).__name__)
                      for k,v in (d.items() if isinstance(d,dict) else []):
                        if isinstance(v,list):
                          print("LIST",k,"COUNT",len(v))
                          if v and isinstance(v[0],dict):
                            x=next((x for x in v if x.get("date")=="2026-10-13"),v[-1])
                            print("ENTRYKEYS",list(x),"DATE",x.get("date"))
                            p=x.get("puzzle",x)
                            if isinstance(p,dict):
                              print("PUZZLEKEYS",list(p))
                              for key,val in p.items():
                                if isinstance(val,list): print("FIELD",key,"list",len(val),"head",repr(val[:2])[:250])
                                elif isinstance(val,(str,int,float,bool)):print("FIELD",key,"scalar",str(val)[:150])
                      break
                    except Exception as e: print("JSONERROR",repr(e))
              except urllib.error.HTTPError as e:
                print("URL",url,"BROWSER",browser,"ERROR",e.code,"BODY",e.read(400).decode("utf8","replace"))
              except Exception as e: print("URL",url,"BROWSER",browser,"ERROR",repr(e))
          PY
