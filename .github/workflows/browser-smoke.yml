name: Browser smoke
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser harness
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit
      - name: Serve the static PWA and exercise Golden Path
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
          sleep 2
          node tests/browser-smoke.mjs
          node tests/storage-quota-smoke.mjs
